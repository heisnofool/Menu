<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교회 메뉴 선택 시스템 (모바일 안정판)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow p-6">
    <h1 class="text-2xl font-bold mb-2">🍱 일요일 점심 메뉴 선택</h1>
    <p class="text-sm text-gray-600 mb-4">※ 1인 1회 입력 가능 / 마감 후 수정 불가</p>

    <div id="deadlineBox" class="mb-4 text-sm"></div>

    <!-- 입력 폼 -->
    <div id="formBox" class="grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
      <div>
        <label class="text-sm font-medium">이름</label>
        <input id="name" class="mt-1 w-full border rounded p-2" placeholder="예: 홍길동" />
      </div>
      <div id="menuInputs" class="md:col-span-4 grid grid-cols-1 md:grid-cols-3 gap-3"></div>
      <button onclick="addEntry()" class="px-4 py-2 rounded-xl bg-blue-600 text-white">제출</button>
    </div>

    <h2 class="text-xl font-semibold mt-6 mb-2">개별 선택 내역</h2>
    <table class="w-full border text-sm">
      <thead class="bg-gray-100">
        <tr id="tableHead"></tr>
      </thead>
      <tbody id="entries"></tbody>
    </table>

    <h2 class="text-xl font-semibold mt-6 mb-2">📊 총 집계 (관리자용)</h2>
    <ul id="totalList" class="list-disc pl-5 text-lg"></ul>

    <!-- 관리자 마감 설정 -->
    <div class="mt-8 border-t pt-4">
      <h2 class="text-xl font-semibold mb-2">⏰ 관리자 마감 설정</h2>
      <p class="text-sm text-gray-600 mb-2">※ 관리자만 수정 가능</p>
      <div class="flex flex-col md:flex-row gap-2 mb-2">
        <input id="adminDeadline" type="datetime-local" class="border rounded p-2" />
        <button onclick="setDeadline()" class="px-3 py-2 bg-blue-600 text-white rounded">마감일 설정/수정</button>
        <button onclick="forceClose()" class="px-3 py-2 bg-red-600 text-white rounded">🚫 강제 마감</button>
      </div>
    </div>

    <!-- 관리자 메뉴 설정 -->
    <div class="mt-8 border-t pt-4">
      <h2 class="text-xl font-semibold mb-2">⚙️ 관리자 메뉴 설정</h2>
      <p class="text-sm text-gray-600 mb-2">※ 비밀번호 입력 후 메뉴 추가/삭제</p>
      <div class="flex flex-col md:flex-row gap-2 mb-2">
        <input id="adminPw" type="password" class="border rounded p-2 md:w-40" placeholder="관리자 비밀번호" />
        <input id="newMenu" class="border rounded p-2 flex-1" placeholder="예: 제육덮밥" />
        <button onclick="addMenu()" class="px-3 py-2 bg-green-600 text-white rounded">메뉴 추가</button>
      </div>
      <ul id="menuConfigList" class="list-disc pl-5 text-sm"></ul>
    </div>
  </div>

<script>
  let menuConfig = ['돈가스', '김밥', '샐러드'];
  const ADMIN_PASSWORD = 'admin123';
  let DEADLINE = new Date('2026-01-20T22:00');
  let isForceClosed = false;
  let entries = {};

  checkDeadline();
  renderMenus();

  function checkDeadline() {
    const box = document.getElementById('deadlineBox');
    const now = new Date();

    if (isForceClosed) {
      box.innerText = '⛔ 관리자에 의해 강제 마감되었습니다.';
      document.getElementById('formBox').style.display = 'none';
      return;
    }

    if (now > DEADLINE) {
      box.innerText = '⛔ 메뉴 선택이 마감되었습니다.';
      document.getElementById('formBox').style.display = 'none';
    } else {
      box.innerText = '⏰ 마감: ' + DEADLINE.toLocaleString();
      document.getElementById('formBox').style.display = 'grid';
    }
  }

  function setDeadline() {
    const pw = document.getElementById('adminPw').value;
    if (pw !== ADMIN_PASSWORD) return alert('관리자 비밀번호가 틀렸습니다');

    const value = document.getElementById('adminDeadline').value;
    if (!value) return alert('마감일자를 입력하세요');

    DEADLINE = new Date(value);
    isForceClosed = false;
    alert('마감일이 설정되었습니다');
    checkDeadline();
  }

  function forceClose() {
    const pw = document.getElementById('adminPw').value;
    if (pw !== ADMIN_PASSWORD) return alert('관리자 비밀번호가 틀렸습니다');
    if (!confirm('정말 강제 마감하시겠습니까?')) return;
    isForceClosed = true;
    checkDeadline();
  }

  function renderMenus() {
    const menuInputs = document.getElementById('menuInputs');
    const menuList = document.getElementById('menuConfigList');
    const tableHead = document.getElementById('tableHead');

    menuInputs.innerHTML = '';
    menuList.innerHTML = '';

    tableHead.innerHTML = '<th class="border p-2">이름</th>' +
      menuConfig.map(m => `<th class="border p-2">${m}</th>`).join('') +
      '<th class="border p-2">관리</th>';

    menuConfig.forEach(m => {
      menuInputs.innerHTML += `
        <div>
          <label class="text-sm font-medium">${m}</label>
          <input id="menu_${m}" type="number" min="0" value="0" class="mt-1 w-full border rounded p-2" />
        </div>`;
      menuList.innerHTML += `<li>${m} <button onclick="removeMenu('${m}')" class="text-red-500 ml-2">삭제</button></li>`;
    });
  }

  function addMenu() {
    const pw = document.getElementById('adminPw').value;
    if (pw !== ADMIN_PASSWORD) return alert('관리자 비밀번호가 틀렸습니다');
    const m = document.getElementById('newMenu').value.trim();
    if (!m || menuConfig.includes(m)) return;
    menuConfig.push(m);
    document.getElementById('newMenu').value = '';
    renderMenus();
    render();
  }

  function removeMenu(m) {
    const pw = document.getElementById('adminPw').value;
    if (pw !== ADMIN_PASSWORD) return alert('관리자 비밀번호가 틀렸습니다');
    menuConfig = menuConfig.filter(x => x !== m);
    Object.values(entries).forEach(e => delete e[m]);
    renderMenus();
    render();
  }

  function addEntry() {
    checkDeadline();
    if (isForceClosed || new Date() > DEADLINE) return alert('마감되었습니다');

    const name = document.getElementById('name').value.trim();
    if (!name || entries[name]) return alert('이름 오류 또는 중복 제출');

    let total = 0;
    const selection = {};
    menuConfig.forEach(m => {
      const v = Number(document.getElementById('menu_' + m).value);
      selection[m] = v;
      total += v;
    });

    if (total === 0) return alert('메뉴를 하나 이상 선택하세요');
    entries[name] = selection;
    document.getElementById('name').value = '';
    render();
  }

  function deleteEntry(name) {
    const pw = document.getElementById('adminPw').value;
    if (pw !== ADMIN_PASSWORD) return alert('관리자 비밀번호가 틀렸습니다');
    delete entries[name];
    render();
  }

  function render() {
    const tbody = document.getElementById('entries');
    const totalList = document.getElementById('totalList');
    tbody.innerHTML = '';
    totalList.innerHTML = '';

    const totals = {};
    menuConfig.forEach(m => totals[m] = 0);

    Object.entries(entries).forEach(([name, e]) => {
      let row = `<td class="border p-2 text-center">${name}</td>`;
      menuConfig.forEach(m => {
        row += `<td class="border p-2 text-center">${e[m]}</td>`;
        totals[m] += e[m];
      });
      row += `<td class="border p-2 text-center"><button onclick="deleteEntry('${name}')" class="text-red-600">삭제</button></td>`;
      const tr = document.createElement('tr');
      tr.innerHTML = row;
      tbody.appendChild(tr);
    });

    menuConfig.forEach(m => {
      const li = document.createElement('li');
      li.innerText = `${m}: ${totals[m]}개`;
      totalList.appendChild(li);
    });
  }
</script>
</body>
</html>
